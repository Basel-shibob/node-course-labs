<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="board">
      <header>
        <h1>Task board</h1>
        <span id="presence" class="presence">— online</span>
      </header>

      <form id="add-form" autocomplete="off">
        <input id="title-input" type="text" placeholder="What needs doing?" required />
        <button type="submit">Add</button>
      </form>

      <ul id="task-list"></ul>
      <p id="empty-state" hidden>No tasks yet. Add the frist one.</p>
    </main>

    <script src="socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
